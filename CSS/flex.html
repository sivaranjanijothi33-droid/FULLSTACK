<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: block;
            background-color: aqua;
            width: 100px;
            margin-right: 30;
        }
        .inline{
            display: inline;
            background-color: chartreuse;
            width: 100px;
            margin-right: 30px;
        }
         .inlineblock{
            display: inline-block;
            background-color: blue;
            width: 100px;
            margin: 30px;
         }
        .navbar{
            background-color: rgb(42, 165, 63);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .list{
            list-style: none;
        }
        .link{
            text-decoration: none;
            color: rgb(108, 160, 95);
            padding: 10px;
            background-color: rgb(210, 30, 30);
            border-radius: 10px;
        }
        .link:hover{
            cursor: pointer;
            background-color: aquamarine;
            color: beige;
        }

        
    </style>
</head>
<body>
    <nav>
        <ul class="navbar">
            <li class="list"><a href="" class="link">home</a></li>
            <li class="list"><a href="" class="link">about</a></li>
            <li class="list"><a href="" class="link">contact</a></li>
            <li class="list"><a href="" class="link">service</a></li>
            </ul>
            </nav>
    <p class="container">Lorem ipsum dolor sit.</p>
    <p class="inline">Lorem ipsum dolor sit.</p>
    <p class="inlineblock">Lorem ipsum dolor sit.</p>
    <span>Lorem ipsum dolor sit amet.</span>
</body>
</html>
